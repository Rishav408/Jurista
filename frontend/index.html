<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jurista — AI-Powered Indian Legal Intelligence</title>
    <meta
      name="description"
      content="Navigate Indian law with confidence. Jurista brings together 50,000+ legal sections, landmark cases, and real-time updates with AI that understands Indian law."
    />
    <meta name="theme-color" content="#d97706" />
    <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: light)" href="/brand/jurista-icon-light.svg" />
    <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: dark)" href="/brand/jurista-icon-dark.svg" />
    <link rel="apple-touch-icon" href="/brand/jurista-icon-light.svg" />

    <!-- Apply the saved theme before first paint to avoid a FOUC flash.
         Keep this key in sync with STORAGE_KEYS.theme (src/lib/constants.js). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('jurista_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Fonts: Inter + Playfair Display (editorial legal aesthetic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
